[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
]
# The cross-stack claim vector lives beside the verifier's tests; both stacks read the same bytes.
fs_permissions = [{ access = "read", path = "../verifier/test/fixtures" }]
